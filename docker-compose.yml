services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: loguser
      POSTGRES_PASSWORD: logpass
      POSTGRES_DB: logs
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loguser -d logs"]
      interval: 5s
      timeout: 5s
      retries: 10
    cpus: 1.0
    mem_limit: 1024m

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://loguser:logpass@postgres:5432/logs
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    cpus: 0.5
    mem_limit: 256m
volumes:
  pgdata: